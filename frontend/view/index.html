<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="zeyad ahmed hussin">
    <meta name="description" content="login gateway to make authencation process">
    <meta name="name" content="GeoEnergy | login">
    <title>Login | GeoEnergy</title>
    <link rel="shortcut icon" href="../assets/images/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="../style/index.css">
</head>
<body>
    <form action="" method="get">
        <!-- LOGO SECTION -->
       <img src="../assets/images/logo.png" alt="GeoEnergy Logo" loading="lazy" height="100px" width="100px" id="logo">
       <!-- HEAD OF FORM -->
        <h2>Welcome to GeoEnergy</h2>
        <!-- INPUT FIELDS -->
         <!-- EMAIL INPUT -->
         <section class="email-input">
            <img src="../assets/icons/email-icon.png" alt="Email Icon" loading="lazy" height="100px" width="100px" id="email-icon">
            <input type="email" name="email" id="email" placeholder="Email Address" required>
         </section>
         <!-- PASSWORD INPUT -->
         <section class="password-input">
            <img src="../assets/icons/password-icon.png" alt="Password Icon" loading="lazy" height="100px" width="100px">
            <input type="password" name="password" id="password" placeholder="Password" required>
         </section>
         <!-- OTHER LINKS -->
          <section class="links">
            <a href="#">Forgot Password?</a>
            <a href="#">Forget Email ?</a>
          </section>
          <!-- LOGIN BUTTON -->
            <button type="submit">Login</button>
           <!-- CREATE ACCOUNT LINK -->
            <p>New User ? <a href="../view/create-account.html">Create an Account</a></p>
    </form>
</body>
 <script src="../javascript/index.js"></script>
</html>
