<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="zeyad ahmed hussin">
    <meta name="description" content="create account gateway for GeoEnergy">
    <meta name="name" content="GeoEnergy | Create Account">
    <title>Create Account | GeoEnergy</title>
    <link rel="shortcut icon" href="../assets/images/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="../style/create-account.css">
</head>
<body>
    <form action="" method="get">
        <!-- LOGO SECTION -->
       <img src="../assets/images/logo.png" alt="GeoEnergy Logo" loading="lazy" height="100px" width="100px" id="logo">
       <!-- HEAD OF FORM -->
        <h2>Create Account</h2>
        <!-- INPUT FIELDS -->
         <!-- FULL NAME INPUT -->
         <section class="full-name">
            <img src="../assets/icons/name-icon.png" alt="Full Name Icon" loading="lazy" height="100px" width="100px" id="full-name-icon">
            <input type="text" name="full-name" id="full-name" placeholder="Full Name" required>
         </section>
         <!-- EMAIL INPUT -->
         <section class="email-input">
            <img src="../assets/icons/email-icon.png" alt="Email Icon" loading="lazy" height="100px" width="100px" id="email-icon">
            <input type="email" name="email" id="email" placeholder="Email Address" required>
         </section>
         <!-- PASSWORD INPUT -->
         <section class="password-input">
            <img src="../assets/icons/password-icon.png" alt="Password Icon" loading="lazy" height="100px" width="100px">
            <input type="password" name="password" id="password" placeholder="Password" required>
         </section>
         <!-- PHONE NUMBER INPUT -->
         <section class="phone-input">
            <img src="../assets/icons/phone-number-icon.png" alt="Phone Number Icon" loading="lazy" height="100px" width="100px" id="phone-icon">
            <input type="tel" name="phone" id="phone" placeholder="Phone Number" required>
         </section>
         <!-- CREATE ACCOUNT BUTTON -->
            <button type="submit">Submit</button>
           <!-- HAVE ACCOUNT LINK -->
            <p>Already have an account? <a href="../view/index.html">Login</a></p>
    </form>
</body>
 <script src="../javascript/create-account.js"></script>
</html>
